<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Fundora crowdfunding platform</title>
  <desc id="description">Fundora project cover with campaign and funding graphics</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2d"/>
      <stop offset="0.55" stop-color="#0b4f6c"/>
      <stop offset="1" stop-color="#15a085"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#001018" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <circle cx="1060" cy="90" r="220" fill="#5eead4" opacity=".08"/>
  <circle cx="90" cy="700" r="300" fill="#facc15" opacity=".06"/>
  <g transform="translate(90 92)">
    <text x="0" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">FUNDORA</text>
    <text x="0" y="103" fill="#b8e9e1" font-family="Arial, sans-serif" font-size="24">Fund ideas. Build impact.</text>
  </g>
  <g transform="translate(90 245)" filter="url(#shadow)">
    <rect width="1020" height="380" rx="32" fill="#ffffff" opacity=".96"/>
    <rect x="34" y="34" width="410" height="312" rx="22" fill="#dff7f2"/>
    <path d="M92 264 C148 204 194 230 238 160 C284 88 338 118 394 70" fill="none" stroke="#0f9f87" stroke-width="18" stroke-linecap="round"/>
    <circle cx="394" cy="70" r="21" fill="#facc15"/>
    <text x="486" y="88" fill="#0b2533" font-family="Arial, sans-serif" font-size="25" font-weight="700">Campaign progress</text>
    <text x="486" y="151" fill="#0f9f87" font-family="Arial, sans-serif" font-size="52" font-weight="700">82%</text>
    <rect x="486" y="177" width="460" height="18" rx="9" fill="#d9ebe8"/>
    <rect x="486" y="177" width="377" height="18" rx="9" fill="url(#accent)"/>
    <g fill="#59717b" font-family="Arial, sans-serif" font-size="20">
      <text x="486" y="248">Supporters</text><text x="858" y="248">Credits raised</text>
    </g>
    <g fill="#0b2533" font-family="Arial, sans-serif" font-size="29" font-weight="700">
      <text x="486" y="290">1,248</text><text x="858" y="290">48,500</text>
    </g>
  </g>
</svg>

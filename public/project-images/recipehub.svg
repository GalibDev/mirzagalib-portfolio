<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">RecipeHub recipe sharing platform</title>
  <desc id="description">RecipeHub project cover with recipe cards and cooking graphics</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b160d"/>
      <stop offset=".55" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#2b160d" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <circle cx="1080" cy="100" r="250" fill="#fff7ed" opacity=".1"/>
  <circle cx="110" cy="720" r="300" fill="#fde68a" opacity=".08"/>
  <g transform="translate(90 92)">
    <text x="0" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">RecipeHub</text>
    <text x="0" y="103" fill="#ffedd5" font-family="Arial, sans-serif" font-size="24">Discover, share, and save recipes.</text>
  </g>
  <g transform="translate(90 240)" filter="url(#shadow)">
    <rect width="1020" height="390" rx="34" fill="#fffaf3"/>
    <g transform="translate(35 35)">
      <rect width="285" height="320" rx="22" fill="#fed7aa"/>
      <circle cx="142" cy="122" r="88" fill="#ffffff"/>
      <circle cx="142" cy="122" r="65" fill="#fb923c"/>
      <path d="M93 126c30-44 72-42 98 0-20 42-76 42-98 0z" fill="#7c2d12" opacity=".75"/>
      <text x="24" y="258" fill="#431407" font-family="Arial, sans-serif" font-size="24" font-weight="700">Chef's special</text>
      <text x="24" y="294" fill="#9a3412" font-family="Arial, sans-serif" font-size="18">25 min · Premium</text>
    </g>
    <g transform="translate(350 52)">
      <text x="0" y="35" fill="#431407" font-family="Arial, sans-serif" font-size="30" font-weight="700">Find your next favorite dish</text>
      <rect x="0" y="72" width="590" height="58" rx="29" fill="#ffedd5"/>
      <circle cx="34" cy="101" r="12" fill="none" stroke="#c2410c" stroke-width="5"/>
      <line x1="43" y1="110" x2="54" y2="121" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>
      <text x="75" y="109" fill="#9a6a54" font-family="Arial, sans-serif" font-size="19">Search recipes and ingredients</text>
      <g transform="translate(0 166)">
        <rect width="180" height="115" rx="18" fill="#fef3c7"/>
        <rect x="205" width="180" height="115" rx="18" fill="#dcfce7"/>
        <rect x="410" width="180" height="115" rx="18" fill="#fee2e2"/>
        <g fill="#7c2d12" font-family="Arial, sans-serif" font-size="18" font-weight="700">
          <text x="22" y="68">Favorites</text>
          <text x="227" y="68">My Recipes</text>
          <text x="432" y="68">Trending</text>
        </g>
      </g>
    </g>
  </g>
</svg>
